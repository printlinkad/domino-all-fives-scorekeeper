<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f2">
  <title>حساب الدومينو — All Fives</title>
  <style>
    :root{color-scheme:light;--ink:#1c2927;--muted:#687572;--paper:#f5f6f2;--card:#fff;--line:#e2e8e2;--green:#126b57;--green-dark:#0e5646;--mint:#e4f4ec;--red:#a33f38;--red-pale:#fff0ed;--gold:#c99631;--shadow:0 12px 30px rgba(23,49,41,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{touch-action:manipulation} .shell{width:min(100%,680px);margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;margin:3px 0 17px}.brand{display:flex;align-items:center;gap:11px}.mark{width:44px;height:44px;border-radius:15px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:23px;box-shadow:0 6px 14px #126b5733}.eyebrow{font-size:12px;color:var(--muted);margin:0 0 2px}.title{font-size:20px;line-height:1.2;margin:0;font-weight:800}.target{display:flex;align-items:center;gap:6px;padding:9px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:13px;color:var(--muted);white-space:nowrap}.target b{color:var(--green);font-size:18px}
    .notice{background:var(--mint);border:1px solid #cce6d8;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.55;color:#265747;margin-bottom:14px}.notice span{font-size:18px;line-height:1.35}
    .mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}.mode button{height:47px;border-radius:15px;border:1px solid var(--line);background:#fff;color:#53615d;font-weight:750;font-size:15px}.mode button.active-add{background:var(--green);border-color:var(--green);color:#fff}.mode button.active-sub{background:var(--red-pale);border-color:#e8b9b2;color:var(--red)}.mode button:active,.value:active,.reset:active,.undo:active{transform:scale(.98)}
    .board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.player{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:13px;box-shadow:0 3px 11px #1c292708;transition:.2s}.player.selected{border-color:var(--green);box-shadow:0 0 0 2px #126b5718, var(--shadow)}.player.winner{border-color:#e7ce91;background:#fffaf0}.player-top{display:flex;align-items:center;justify-content:center;gap:6px}.name{min-width:0;width:100%;text-align:center;border:0;background:transparent;padding:2px 0;color:var(--ink);font-size:19px;font-weight:800;outline:none;text-overflow:ellipsis}.name:focus{border-bottom:1px solid var(--green)}.player-score{font-size:44px;line-height:1.1;letter-spacing:-1px;font-weight:800;margin:11px 0 7px;text-align:center;font-variant-numeric:tabular-nums}.score-progress{height:7px;background:#edf0ed;border-radius:20px;overflow:hidden;margin:8px 0 13px}.score-progress span{display:block;height:100%;width:var(--progress);border-radius:inherit;background:var(--green);transition:width .25s}.winner .score-progress span{background:var(--gold)}.card-hint{text-align:center;font-size:13px;font-weight:700;margin:16px 0 10px}.card-values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.value{aspect-ratio:1/1;width:clamp(42px,14vw,54px);justify-self:center;border:0;border-radius:50%;background:#202020;font-size:24px;font-weight:800;color:#fff;box-shadow:0 2px 5px #1c29271a}.value:active{background:var(--green);color:#fff}.winner .value{background:#51452c}.player-foot{display:flex;align-items:center;justify-content:center;margin-top:12px;min-height:20px}.score-caption{font-size:11px;color:var(--muted)}.won{font-size:11px;color:#936b1d;font-weight:700}
    .history{margin-top:17px}.history-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.history-head h2{font-size:16px;margin:0}.history-count{font-size:11px;color:var(--muted)}.history-list{list-style:none;margin:0;padding:0;display:grid;gap:7px}.move{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}.move-icon{width:31px;height:31px;flex:0 0 31px;border-radius:11px;display:grid;place-items:center;font-weight:800;background:var(--mint);color:var(--green)}.move.minus .move-icon{background:var(--red-pale);color:var(--red)}.move-text{min-width:0;flex:1;font-size:13px}.move-text strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.move-time{font-size:10px;color:var(--muted);margin-top:2px}.move-value{font-size:17px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums}.empty{padding:19px;text-align:center;color:var(--muted);font-size:13px;background:#ffffff99;border:1px dashed #d6dfd8;border-radius:14px}
    .actions{display:flex;gap:9px;margin-top:13px}.actions button{flex:1;min-height:45px;border:1px solid var(--line);border-radius:13px;background:#fff;color:#384642;font-weight:700}.actions .undo{color:var(--green-dark)}.actions button:disabled{opacity:.45}.actions .reset{color:var(--red)}
    dialog{border:0;border-radius:22px;padding:22px;width:min(90vw,390px);box-shadow:0 24px 70px #101d1970;color:var(--ink)}dialog::backdrop{background:#13221fc2;backdrop-filter:blur(3px)}dialog h2{font-size:19px;margin:0 0 8px}dialog p{font-size:14px;line-height:1.6;color:var(--muted);margin:0 0 20px}.dialog-actions{display:flex;gap:9px}.dialog-actions button{flex:1;border:0;border-radius:12px;min-height:45px;font-weight:750}.cancel{background:#eff3ef;color:var(--ink)}.confirm{background:var(--red);color:#fff}.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1d302a;color:#fff;border-radius:13px;padding:10px 16px;font-size:13px;box-shadow:var(--shadow);transition:.22s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:360px){.shell{padding-inline:12px}.player{padding:10px}.player-score{font-size:34px}.value{min-height:40px}.title{font-size:18px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><div class="mark" aria-hidden="true">⚄</div><div><p class="eyebrow">لعبة الدومينو</p><h1 class="title">حساب الـ All Fives</h1></div></div><div class="target"><span>الهدف</span><b>٧١</b><span>نقطة</span></div></header>
    <div class="notice"><span aria-hidden="true">💡</span><div>اختار <strong>جمع +</strong> أو <strong>طرح −</strong> حسب حساب الجولة، وبعدها دوس على الرقم جوّه بطاقة اللاعب.</div></div>
    <div class="mode" role="group" aria-label="نوع العملية"><button type="button" id="addBtn" class="active-add" aria-pressed="true">＋ جمع النقط</button><button type="button" id="subBtn" aria-pressed="false">− طرح النقط</button></div>
    <section class="board" id="players" aria-label="اللاعبون"></section>
    <section class="history"><div class="history-head"><h2>سجل الحركات</h2><span class="history-count" id="historyCount">٠ حركات</span></div><ul class="history-list" id="historyList"></ul><div class="actions"><button class="undo" id="undoBtn" type="button">↶ تراجع عن آخر حركة</button><button class="reset" id="resetBtn" type="button">لعبة جديدة</button></div></section>
  </main>
  <dialog id="confirmDialog" aria-labelledby="dialogTitle"><h2 id="dialogTitle">نبدأ لعبة جديدة؟</h2><p>ده هيمسح النقط وسجل الحركات ويرجّع الأسماء الافتراضية.</p><div class="dialog-actions"><button class="cancel" id="cancelReset" type="button">لأ، كمّل</button><button class="confirm" id="confirmReset" type="button">أيوه، ابدأ</button></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (()=>{
      const KEY='all-fives-score-v1', defaults=['نادر','وليد','نشأت','جو'];
      const $=s=>document.querySelector(s);let state,mode='add',toastTimer;
      function fresh(){return {names:[...defaults],scores:[0,0,0,0],selected:0,moves:[]}}
      try{const saved=JSON.parse(localStorage.getItem(KEY));state=saved&&Array.isArray(saved.names)&&saved.names.length===4&&Array.isArray(saved.moves)?saved:fresh()}catch{state=fresh()}
      if(state.names.every((name,i)=>name===`اللاعب ${'٠١٢٣٤٥٦٧٨٩'[i+1]}`)){state.names=[...defaults];persist()}
      function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
      function render(){
        const players=$('#players');players.replaceChildren();
        state.names.forEach((name,i)=>{const card=document.createElement('article');card.className='player'+(state.selected===i?' selected':'')+(state.scores[i]>=71?' winner':'');
          const top=document.createElement('div');top.className='player-top';const input=document.createElement('input');input.className='name';input.value=name;input.maxLength=22;input.setAttribute('aria-label',`اسم اللاعب ${i+1}`);input.autocomplete='off';input.addEventListener('input',()=>{state.names[i]=input.value;persist();$('#selectedLabel').textContent='اللاعب المختار: '+(state.names[state.selected]||`اللاعب ${state.selected+1}`)});top.append(input);
          const score=document.createElement('div');score.className='player-score';score.textContent=digits(state.scores[i]);
          const progress=document.createElement('div');progress.className='score-progress';progress.setAttribute('role','progressbar');progress.setAttribute('aria-label','التقدم نحو ٧١ نقطة');progress.setAttribute('aria-valuemin','0');progress.setAttribute('aria-valuemax','71');progress.setAttribute('aria-valuenow',String(Math.min(state.scores[i],71)));const fill=document.createElement('span');fill.style.setProperty('--progress',Math.min(state.scores[i]/71*100,100)+'%');progress.append(fill);
          const hint=document.createElement('div');hint.className='card-hint';hint.textContent='اضغط على الرقم';const nums=document.createElement('div');nums.className='card-values';nums.setAttribute('aria-label',`نقط ${name||`اللاعب ${i+1}`}`);for(let n=1;n<=7;n++){const b=document.createElement('button');b.type='button';b.className='value';b.textContent=digits(n);b.setAttribute('aria-label',`${mode==='add'?'إضافة':'طرح'} ${n} ${n===1?'نقطة':'نقط'} ${name||`اللاعب ${i+1}`}`);b.addEventListener('click',()=>addPoints(i,n));nums.append(b)}
          const bottom=document.createElement('div');bottom.className='player-foot';const cap=document.createElement('span');cap.className=state.scores[i]>=71?'won':'score-caption';cap.textContent=state.scores[i]>=71?'وصل للهدف 🎉':'من ٧١ نقطة';bottom.append(cap);card.append(top,score,progress,hint,nums,bottom);players.append(card)});
        const list=$('#historyList');list.replaceChildren();$('#historyCount').textContent=digits(state.moves.length)+' '+(state.moves.length===1?'حركة':'حركات');
        if(!state.moves.length){const empty=document.createElement('li');empty.className='empty';empty.textContent='لسه مفيش حركات — اختار لاعب ودوس على رقم';list.append(empty)}else [...state.moves].reverse().forEach(m=>{const li=document.createElement('li');li.className='move'+(m.delta<0?' minus':'');const icon=document.createElement('span');icon.className='move-icon';icon.textContent=m.delta<0?'−':'+';const text=document.createElement('div');text.className='move-text';const strong=document.createElement('strong');strong.textContent=m.name;const time=document.createElement('div');time.className='move-time';time.textContent=m.time;text.append(strong,time);const val=document.createElement('span');val.className='move-value';val.textContent=(m.delta<0?'−':'＋')+digits(Math.abs(m.delta));li.append(icon,text,val);list.append(li)});
        $('#undoBtn').disabled=!state.moves.length;
      }
      function digits(n){return String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d])}
      function showToast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1900)}
      function addPoints(i,value){const delta=mode==='add'?value:-value;state.selected=i;const before=state.scores[i];state.scores[i]=Math.max(0,before+delta);
        // Store the applied delta so undo exactly reverses what changed (including the zero floor).
        const applied=state.scores[i]-before;state.moves.push({index:i,name:state.names[i]||`اللاعب ${i+1}`,delta:applied,time:new Intl.DateTimeFormat('ar-EG',{hour:'numeric',minute:'2-digit'}).format(new Date())});persist();render();if(state.scores[i]>=71)showToast('🎉 '+(state.names[i]||'اللاعب')+' وصل لـ ٧١ نقطة!');}
      $('#addBtn').addEventListener('click',()=>{mode='add';$('#addBtn').className='active-add';$('#subBtn').className='';$('#addBtn').setAttribute('aria-pressed','true');$('#subBtn').setAttribute('aria-pressed','false')});
      $('#subBtn').addEventListener('click',()=>{mode='sub';$('#subBtn').className='active-sub';$('#addBtn').className='';$('#subBtn').setAttribute('aria-pressed','true');$('#addBtn').setAttribute('aria-pressed','false')});
      $('#undoBtn').addEventListener('click',()=>{const m=state.moves.pop();if(!m)return;state.scores[m.index]=Math.max(0,state.scores[m.index]-m.delta);persist();render();showToast('اتراجعنا عن آخر حركة')});
      const dialog=$('#confirmDialog');$('#resetBtn').addEventListener('click',()=>dialog.showModal());$('#cancelReset').addEventListener('click',()=>dialog.close());$('#confirmReset').addEventListener('click',()=>{state=fresh();mode='add';$('#addBtn').className='active-add';$('#subBtn').className='';dialog.close();persist();render();showToast('بدأنا لعبة جديدة')});dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
      render();
    })();
  </script>
</body>
</html>
