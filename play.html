<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#102b27"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="أول فايف"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="manifest" href="./manifest.webmanifest"><title>دومينو أول فايف</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>
:root{--bg:#0e2622;--felt:#17453a;--felt2:#1d5546;--gold:#f4c96b;--cream:#fff8e8;--muted:#adc4b8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#173b32,var(--bg) 70%);color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:14px 12px 30px}.wrap{max-width:850px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{font-size:21px;font-weight:850}.brand span{color:var(--gold)}.tag{font-size:12px;color:var(--muted);border:1px solid #ffffff24;border-radius:99px;padding:7px 10px}.panel{background:#ffffff0c;border:1px solid #ffffff16;border-radius:18px;padding:14px;margin-bottom:12px}.setup{text-align:center}.setup h1{font-size:21px;margin:4px 0 8px}.setup p{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 14px}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.input{border:1px solid #ffffff30;background:#091c18;color:white;padding:11px 13px;border-radius:11px;font:15px system-ui;min-width:130px;outline:none}.input::placeholder{color:#87a398}.btn{border:0;border-radius:11px;background:var(--gold);color:#1a2a22;padding:11px 15px;font:700 14px system-ui;cursor:pointer}.btn.secondary{background:#ffffff12;color:var(--cream);border:1px solid #ffffff22}.btn:disabled{opacity:.4}.roomcode{color:var(--gold);font-weight:800;letter-spacing:1px}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.score{background:#ffffff09;border:1px solid #ffffff13;border-radius:13px;padding:9px 5px;text-align:center;min-width:0}.score.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px #f4c96b50}.score .name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score b{display:block;font-size:24px;color:var(--gold)}.score small{font-size:10px;color:#dce6df}.table{min-height:218px;background:linear-gradient(135deg,var(--felt2),var(--felt));border-radius:17px;border:5px solid #795734;box-shadow:0 12px 25px #0004,inset 0 0 18px #0003;padding:15px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.chain{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;max-width:100%}.tile{width:56px;height:30px;border:1px solid #d9c8a0;border-radius:6px;background:linear-gradient(#fffdf5,#efe5cc);display:flex;box-shadow:0 2px 4px #0004;flex-shrink:0;padding:3px}.face{width:50%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);place-items:center}.face+.face{border-right:1px solid #c7b894;padding-right:3px}.pipdot{width:4px;height:4px;border-radius:50%;background:#26352d}.stock{position:absolute;top:9px;right:10px;border-radius:99px;background:#09271e9c;padding:5px 9px;font-size:12px}.ends{position:absolute;bottom:7px;left:10px;right:10px;display:flex;justify-content:space-between;color:#e9d8ae;font-size:11px}.status{text-align:center;color:var(--gold);font-size:15px;font-weight:750;margin:11px 0 2px}.hint{text-align:center;color:var(--muted);font-size:12px;min-height:18px}.hand-title{display:flex;justify-content:space-between;margin-bottom:9px}.hand-title span{font-size:12px;color:var(--muted)}.hand{display:flex;gap:7px;overflow-x:auto;padding:3px 1px 8px;min-height:67px}.piece{height:53px;min-width:82px;border:1px solid #dfd3b7;border-radius:10px;background:linear-gradient(#fffdf5,#eee2c3);display:flex;align-items:center;justify-content:center;gap:4px;padding:5px;color:#24332b;box-shadow:0 3px 7px #0004;cursor:pointer;touch-action:manipulation}.piece .face{height:40px;width:29px;flex:none}.piece .pipdot{width:6px;height:6px}.divider{height:35px;width:1px;background:#c2b48f}.piece:disabled{opacity:.42;cursor:default}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}.feed{font-size:12px;color:var(--muted);line-height:1.8;margin-top:8px}.foot{text-align:center;color:#8fa89c;font-size:11px;padding:6px}.hidden{display:none!important}@media(max-width:520px){body{padding:11px 9px 24px}.table{min-height:190px;padding:10px 6px}.tile{width:49px;height:27px}.panel{padding:11px}.score b{font-size:22px}.brand{font-size:19px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">دومينو <span>أول فايف</span></div><div class="tag">٤ لاعبين · كل واحد من موبايله</div></header>
<section class="panel setup" id="setup"><h1>العبوا مع بعض أونلاين</h1><p>أنشئ غرفة وابعث الكود لأصحابك. كل لاعب يشوف أحجاره هو بس.</p><div class="row"><button class="btn secondary" id="installBtn" onclick="installApp()">تثبيت اللعبة على الموبايل</button></div><div class="row" style="margin-top:10px"><input class="input" id="name" maxlength="18" placeholder="اسمك"><button class="btn" onclick="createRoom()">إنشاء غرفة</button></div><p style="margin:13px 0 7px">أو اكتب كود الغرفة</p><div class="row"><input class="input" id="roomInput" placeholder="كود الغرفة" autocapitalize="characters"><button class="btn secondary" onclick="joinRoom()">دخول الغرفة</button></div><div id="setupMsg" class="hint" style="margin-top:10px"></div></section>
<section id="game" class="hidden"><section class="panel"><div class="scores" id="scores"></div></section><section class="panel"><div class="table"><div class="stock" id="stock">بانتظار بدء الجولة</div><div class="chain" id="chain"></div><div class="ends" id="ends"></div></div><div class="status" id="status"></div><div class="hint" id="hint"></div><div class="actions"><button class="btn" id="startBtn" onclick="startRound()">ابدأ الجولة</button><button class="btn" id="nextBtn" onclick="startRound()">جولة جديدة</button><button class="btn secondary" id="shareBtn" onclick="shareRoom()">مشاركة كود الغرفة</button><button class="btn secondary" onclick="leaveRoom()">خروج</button></div><div class="feed" id="feed"></div></section><section class="panel"><div class="hand-title"><strong id="handLabel">أحجارك</strong><span id="handCount"></span></div><div class="hand" id="hand"></div><div class="actions"><button class="btn secondary" id="passBtn" onclick="sendMove('pass')">تخطي الدور</button></div></section></section>
<div class="foot">اللعب يحتاج إنترنت. النقاط: مجموع أحجار المنافسين ÷ ٥، والتقريب لأسفل. أول من يصل إلى ٥ نقاط يكسب.</div></main>
<script>
let peer=null,conn=null,isHost=false,myIndex=-1,roomCode='',hostId='',players=[],board=[],turn=0,started=false,roundOver=false,history=[];const $=id=>document.getElementById(id), ar=n=>String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function say(t){$('setupMsg').textContent=t}function me(){return $('name').value.trim()||'لاعب'}function face(n){const pat={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};return '<div class="face">'+Array.from({length:9},(_,i)=>'<b class="'+(pat[n].includes(i)?'pipdot':'')+'"></b>').join('')+'</div>'}
function createRoom(){if(typeof Peer==='undefined'){say('تعذر تحميل خدمة الاتصال. تأكد من الإنترنت ثم أعد فتح الصفحة.');return}isHost=true;myIndex=0;roomCode='domino-'+Math.random().toString(36).slice(2,9);say('جاري إنشاء الغرفة…');peer=new Peer(roomCode);peer.on('open',id=>{hostId=id;players=[{name:me(),score:0,hand:[]}];$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('shareBtn').textContent='كود الغرفة: '+roomCode;peer.on('connection',c=>{if(players.length>=4){c.on('open',()=>c.send({type:'full'}));setTimeout(()=>c.close(),500);return}c.on('open',()=>{c.on('data',d=>hostMessage(c,d));c.send({type:'welcome',index:players.length,players:players.map(p=>p.name)});});});render()});peer.on('error',e=>say('حصلت مشكلة في الاتصال: '+(e.type==='unavailable-id'?'الكود مستخدم، جرّب إنشاء غرفة جديدة.':'تأكد من الإنترنت وحاول مرة أخرى.')))}
function joinRoom(){if(typeof Peer==='undefined'){say('تعذر تحميل خدمة الاتصال. تأكد من الإنترنت ثم أعد فتح الصفحة.');return}let code=$('roomInput').value.trim().toLowerCase();if(!code){say('اكتب كود الغرفة أولًا.');return}isHost=false;roomCode=code;say('جاري الاتصال بالغرفة…');peer=new Peer();peer.on('open',()=>{conn=peer.connect(code,{reliable:true});conn.on('open',()=>conn.send({type:'join',name:me()}));conn.on('data',clientMessage);conn.on('error',()=>say('تعذر الاتصال بالغرفة. راجع الكود وحاول مرة أخرى.'))});peer.on('error',()=>say('ما لقيناش الغرفة. تأكد من الكود والإنترنت.'))}
function hostMessage(c,d){if(d.type==='join'){if(players.some(p=>p.name===d.name)){d.name+=' '+(players.length+1)}players.push({name:String(d.name||'لاعب').slice(0,18),score:0,hand:[]});let ix=players.length-1;c.__ix=ix;c.send({type:'welcome',index:ix,room:roomCode});history.unshift(players[ix].name+' دخل الغرفة');broadcast()}else if(d.type==='move'){handleMove(c.__ix,d)}}
function clientMessage(d){if(d.type==='full'){say('الغرفة مكتملة (٤ لاعبين).');return}if(d.type==='welcome'){myIndex=d.index;players=(d.players||[]).map(name=>({name,score:0,hand:[]}));if(d.room)roomCode=d.room;$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('shareBtn').textContent='كود الغرفة: '+roomCode;return}if(d.type==='state'){players=d.public.players;board=d.public.board;turn=d.public.turn;started=d.public.started;roundOver=d.public.roundOver;history=d.public.history;$('hand').dataset.tiles=JSON.stringify(d.hand||[]);render(d.hand||[]);}}
function broadcast(){let pub={players:players.map(p=>({name:p.name,score:p.score,count:p.hand.length,total:p.hand.reduce((s,t)=>s+t[0]+t[1],0)})),board,turn,started,roundOver,history};render(players[0]?.hand||[]);if(peer)for(const id in peer.connections)for(const c of peer.connections[id])if(c.open&&c.__ix!=null)c.send({type:'state',public:pub,hand:players[c.__ix]?.hand||[]})}
function startRound(){if(!isHost)return;if(players.length<4){$('hint').textContent='محتاجين ٤ لاعبين قبل بدء الجولة. ابعت الكود لأصحابك.';return}let deck=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)deck.push([a,b]);for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}players.forEach(p=>p.hand=deck.splice(0,7));board=[];turn=0;started=true;roundOver=false;history=['بدأت الجولة وتم توزيع ٧ أحجار لكل لاعب.'];broadcast()}
function playable(t){if(!board.length)return true;return t[0]===board[0][0]||t[1]===board[0][0]||t[0]===board.at(-1)[1]||t[1]===board.at(-1)[1]}function applyTile(t){if(!board.length){board.push(t);return}let l=board[0][0],r=board.at(-1)[1];if(t[1]===l)board.unshift(t);else if(t[0]===l)board.unshift([t[1],t[0]]);else if(t[0]===r)board.push(t);else if(t[1]===r)board.push([t[1],t[0]])}
function sendMove(kind,index){if(isHost)handleMove(0,{kind,index});else if(conn?.open)conn.send({type:'move',kind,index});}
function handleMove(ix,d){if(!started||roundOver||ix!==turn)return;let p=players[ix];if(d.kind==='tile'){let t=p.hand[d.index];if(!t||!playable(t))return;p.hand.splice(d.index,1);applyTile(t);history.unshift(p.name+' لعب حجرًا');if(!p.hand.length){finishRound(ix,false);return}turn=(turn+1)%4;if(!players[turn].hand.some(playable)){let stuck=0;while(stuck<4&&!players[turn].hand.some(playable)){history.unshift(players[turn].name+' تخطى الدور');turn=(turn+1)%4;stuck++}if(stuck===4){finishBlocked();return}}}else if(d.kind==='pass'){if(p.hand.some(playable))return;history.unshift(p.name+' تخطى الدور');turn=(turn+1)%4;let stuck=0;while(stuck<4&&!players[turn].hand.some(playable)){history.unshift(players[turn].name+' تخطى الدور');turn=(turn+1)%4;stuck++}if(stuck===4){finishBlocked();return}}broadcast()}
function finishBlocked(){let low=Math.min(...players.map(p=>p.hand.reduce((s,t)=>s+t[0]+t[1],0)));let w=players.findIndex(p=>p.hand.reduce((s,t)=>s+t[0]+t[1],0)===low);finishRound(w,true)}function finishRound(w,blocked){let sum=players.reduce((s,p,i)=>s+(i===w?0:p.hand.reduce((a,t)=>a+t[0]+t[1],0)),0),pts=Math.floor(sum/5);players[w].score+=pts;roundOver=true;history.unshift((blocked?'اللعب اتقفل. ':'')+players[w].name+' كسب الجولة وأخذ '+pts+' نقطة');if(players[w].score>=5)history.unshift('🏆 '+players[w].name+' كسب المباراة!');broadcast()}
function render(hand){if(!players.length)return;$('scores').innerHTML=Array.from({length:4},(_,i)=>players[i]||{name:'بانتظار لاعب',score:0,count:0}).map((p,i)=>'<div class="score '+(i===turn&&started&&!roundOver?'active':'')+'"><div class="name">'+(i===myIndex?'أنت · ':'')+p.name+'</div><b>'+ar(p.score)+'</b><small>'+(started?'بيده '+ar(p.count??p.hand?.length??0)+' أحجار':'في الغرفة')+'</small></div>').join('');/* remove extra fifth visual for mobile */$('scores').style.gridTemplateColumns='repeat(4,1fr)';$('chain').innerHTML=board.map(t=>'<div class="tile">'+face(t[0])+face(t[1])+'</div>').join('');$('ends').innerHTML=board.length?'<span>يسار '+ar(board[0][0])+'</span><span>يمين '+ar(board.at(-1)[1])+'</span>':'';$('stock').textContent=started?'باقي '+ar(Math.max(0,28-board.length-players.reduce((s,p)=>s+(p.count??p.hand?.length??0),0)))+' حجر':'بانتظار بدء الجولة';$('status').textContent=!started?'الغرفة جاهزة':roundOver?'انتهت الجولة':turn===myIndex?'دورك — اختار حجر':'دور '+(players[turn]?.name||'…');let can=started&&!roundOver&&turn===myIndex;$('hint').textContent=can&&hand.length&&!hand.some(playable)?'مافيش حجر مناسب؛ اضغط تخطي الدور.':'';$('handLabel').textContent='أحجارك';$('handCount').textContent=hand.length?ar(hand.length)+' أحجار':'';$('hand').innerHTML=hand.map((t,i)=>'<button class="piece" '+(!can||!playable(t)?'disabled':'')+' onclick="sendMove(\'tile\','+i+')">'+face(t[0])+'<span class="divider"></span>'+face(t[1])+'</button>').join('');$('passBtn').disabled=!can||hand.some(playable)||!board.length;$('startBtn').classList.toggle('hidden',!isHost||started&&!roundOver);$('startBtn').disabled=players.length<4;$('startBtn').textContent=players.length<4?'بانتظار ٤ لاعبين ('+players.length+'/٤)':'ابدأ الجولة';$('nextBtn').classList.toggle('hidden',!isHost||!roundOver);$('feed').innerHTML=(history||[]).slice(0,4).map(x=>'• '+x).join('<br>');}
function shareRoom(){let msg='تعالوا نلعب دومينو أول فايف! كود الغرفة: '+roomCode+'\nافتحوا رابط اللعبة على الموبايل واكتبوا الكود.';if(navigator.share)navigator.share({title:'دومينو أول فايف',text:msg,url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(msg).then(()=>$('hint').textContent='نسخت رسالة الدعوة. ابعتها لأصحابك.').catch(()=>prompt('انسخ كود الغرفة:',roomCode))}function leaveRoom(){if(peer)peer.destroy();location.reload()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.installEvent=e});async function installApp(){if(window.installEvent){window.installEvent.prompt();await window.installEvent.userChoice;window.installEvent=null;return}if(/iphone|ipad|ipod/i.test(navigator.userAgent)){alert('لتثبيت اللعبة على الآيفون: افتحها في Safari، اضغط زر المشاركة، ثم اختر إضافة إلى الشاشة الرئيسية.')}else{alert('افتح قائمة المتصفح واختر تثبيت التطبيق أو إضافة إلى الشاشة الرئيسية.')}}if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
